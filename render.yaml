services:
  - type: web
    name: phishguard-url-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VIRUSTOTAL_API_KEY
        sync: false
